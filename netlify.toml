[build]
  # Ausgeliefert wird NUR dist/ (scripts/build-public.mjs, Positivliste). Bis 03.11.2026 war die
  # Repo-Wurzel Publish-Ordner und Repo-Interna waren öffentlich.
  command = "node scripts/build-public.mjs"
  publish = "dist"

[[redirects]]
  from = "/profile"
  to = "/mynd-profile-init.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
